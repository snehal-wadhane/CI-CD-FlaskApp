name: Docker Image, Kubernetes deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1 — TEST
  # Runs first. If any test fails, build & deploy are skipped.
  # ══════════════════════════════════════════════════════════
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest test_app.py -v --tb=short

      - name: Run Tests with Coverage Report
        run: |
          pytest test_app.py -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

  # ══════════════════════════════════════════════════════════
  # JOB 2 — BUILD & DEPLOY
  # Only runs if Test job passes successfully.
  # ══════════════════════════════════════════════════════════
  ImageDeploy:
    runs-on: ubuntu-latest
    needs: Test # ← depends on Test job passing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/docker-flask-app:latest
            ${{ secrets.DOCKER_USERNAME }}/docker-flask-app:${{ github.sha }}

      - name: Logging into Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setting context with AKS
        uses: azure/aks-set-context@v2.0
        with:
          cluster-name: Flask-app-cluster
          resource-group: app-deployment-resources

      - name: Setting up K8 Master namespace
        run: |
          kubectl create namespace flask-app --dry-run=client -o json | kubectl apply -f -

      - uses: azure/k8s-create-secret@v1
        with:
          container-registry-url: docker.io
          container-registry-username: ${{ secrets.DOCKER_USERNAME }}
          container-registry-password: ${{ secrets.DOCKER_PASSWORD }}
          secret-name: edgar-registry-secret
          namespace: flask-app

      - name: Update image tag in deployment manifest
        run: |
          sed -i "s|image:.*docker-flask-app.*|image: ${{ secrets.DOCKER_USERNAME }}/docker-flask-app:${{ github.sha }}|g" manifests/deployment.yml

      - name: Deploying to Kubernetes cluster
        uses: Azure/k8s-deploy@v1
        with:
          manifests: |
            manifests/deployment.yml
            manifests/service.yml
          images: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/docker-flask-app:${{ github.sha }}
          imagepullsecrets: |
            edgar-registry-secret
          namespace: flask-app

      - name: Force rollout restart to pick up new image
        run: |
          kubectl rollout restart deployment/flask-app-deployment -n flask-app

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/flask-app-deployment -n flask-app --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n flask-app
          echo "=== Service & External IP ==="
          kubectl get service flask-app-service -n flask-app
          echo "=== Image being run ==="
          kubectl get deployment flask-app-deployment -n flask-app -o jsonpath='{.spec.template.spec.containers[0].image}'
